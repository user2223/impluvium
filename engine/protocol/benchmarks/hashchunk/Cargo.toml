[package]
name = "impluvium-hashchunk-bench"
version = "0.1.0"
edition = "2021"
license = "0BSD"
publish = false
description = "Functional chunking and hashing benchmark tools"

[[bin]]
name = "chunkbench"
path = "src/main.rs"

[[test]]
name = "hashchunk_integration"
path = "tests/integration.rs"

[dependencies]
impluvium-protocol = { path = "../../../crates/protocol", default-features = false }
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
fastcdc = "=5.0.0"
sha2 = { version = "=0.11.1", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "=1.0.154"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rayon = "=1.12.0"
crossbeam-channel = "=0.5.17"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"
