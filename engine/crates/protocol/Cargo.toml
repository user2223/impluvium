[package]
name = "impluvium-protocol"
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false
description = "Shared impluvium protocol types"

[features]
default = []
server = ["dep:connectrpc", "connectrpc/axum", "connectrpc/json", "dep:axum", "dep:http-body-util", "dep:tokio"]
client = ["dep:connectrpc", "connectrpc/client", "connectrpc/json"]

[dependencies]
buffa = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
buffa-types = { version = "=0.9.2", default-features = false, features = ["std", "json"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
sha2 = { version = "=0.11.1", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
connectrpc = { version = "=0.9.1", optional = true, default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
axum = { version = "=0.8.9", optional = true, default-features = false, features = ["tokio", "http1", "http2"] }
http-body-util = { version = "=0.1.5", optional = true, default-features = false }
tokio = { version = "=1.54.1", optional = true, default-features = false, features = ["rt", "net", "time", "io-util"] }

[dev-dependencies]
hex = "=0.4.3"
serde_json = "=1.0.154"
