[package]
name = "server-db"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Database adapters and migrations for the impluvium server"

[dependencies]
server-domain = { path = "../server-domain", version = "=0.1.0" }
# sqlx is reached only through this crate. The pool connects without TLS: no
# TLS feature is enabled, so a database reached over an untrusted network needs
# a later, explicit decision about TLS support.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "time"] }
