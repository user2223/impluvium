[package]
name = "server-api-types"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "Public web contracts and wire adapters for the impluvium server"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# Derives the TypeScript declarations of the wire shapes; the serde attributes are read by `serde-compat`.
# Without default features, so no formatter is built and the output stays byte-stable.
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat"] }
