[package]
name = "server-http"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "HTTP boundary and web adapters for the impluvium server"

[dependencies]
server-api-types = { path = "../server-api-types", version = "=0.1.0" }
server-domain = { path = "../server-domain", version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["json", "query", "matched-path"] }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt"] }
http-body = { version = "=1.1.0", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
