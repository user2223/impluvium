# One workspace and one lock for all Node projects. The server and its layer use Nuxt 3, the desktop UI uses Nuxt 4,
# so install per project with a directory filter, from the repository root:
#   server:
#     pnpm install --frozen-lockfile --filter "{./server}..." --fail-if-no-match
#   desktop UI:
#     pnpm install --frozen-lockfile --filter "{./desktop/main}..." --fail-if-no-match
#   desktop client:
#     pnpm install --frozen-lockfile --filter "{./desktop}" --filter "{./desktop/main}..." --fail-if-no-match
# Directory filters resolve against the current directory; --fail-if-no-match makes a run from elsewhere fail instead
# of silently installing nothing. An unfiltered install of the whole workspace is not supported.
packages:
  - "server/"
  - "libraries/base/"
  - "desktop/"
  - "desktop/main/"

onlyBuiltDependencies:
  - "@bufbuild/buf"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - unrs-resolver
  - protobufjs

# Every project sees only the packages it declares (no hoisting into the root node_modules).
shamefullyHoist: false
