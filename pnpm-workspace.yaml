packages:
  - "server/"
  - "libraries/base/"
  - "desktop/"

onlyBuiltDependencies:
  - "@bufbuild/buf"
  - "@parcel/watcher"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - unrs-resolver
  - protobufjs

# Every project sees only the packages it declares (no hoisting into the root node_modules).
shamefullyHoist: false
