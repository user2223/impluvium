# impluvium CI – builds and checks only. This workflow gets no secrets: publication, privacy checks and releases
# happen outside of CI. Runs only on the dedicated runner (label impluvium-linux, no Docker socket in jobs).
# Pull requests against impluvium/main run the same jobs; the publication check uses the push run on impluvium/main.
name: impluvium-ci

on:
  push:
    branches: ["impluvium/main"]
    # Release tags are plain SemVer: v0.1.0, v0.1.0-rc.1.
    tags: ["v*"]
  pull_request:
    branches: ["impluvium/main"]
  workflow_dispatch:
    # The probe tag must match the desktop version.
    inputs:
      probe_tag:
        description: "Run the release-tag branch as if this tag (for example v0.4.0) had been pushed; builds only"
        required: false
        default: ""

# Cancel superseded runs of the same pull request. Every other run gets its own group (keyed by event and commit),
# so a push run on the main branch is never cancelled or replaced, also not by a manual run of the same commit;
# publication needs each push run to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # Pinned build inputs: actions by commit SHA, job images by digest, tools by version and checksum.
  # Every pin has exactly one place (tools/ci/check-pins.mjs checks this). The server image's base images are
  # pinned in the Dockerfile; Rust toolchains come from the rust-toolchain.toml files (root: stable,
  # desktop/src-tauri: nightly).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
  COREPACK_VERSION: 0.36.0
  BUILDKIT_VERSION: v0.34.1
  BUILDKIT_SHA256: a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
  BUF_VERSION: 1.75.0
  BUF_SHA256: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
  PROTOC_GEN_BUFFA_VERSION: 0.9.2
  PROTOC_GEN_BUFFA_SHA256: ad0eef58b1f62b0813c1bf028cf1c68a60fd3d250059218b2d6f2683d9139367
  PROTOC_GEN_BUFFA_PACKAGING_VERSION: 0.9.2
  PROTOC_GEN_BUFFA_PACKAGING_SHA256: 4fb7570694ccde8570c6f8d7a07ffdf485dca7f498a8775c7aa51240a97aabd9
  CONNECTRPC_CODEGEN_VERSION: 0.9.0
  CONNECTRPC_CODEGEN_SHA256: 514a7a6fbe705d532ddf490c221db7bd52c5b94fd691cb257a7c18e5646355bb

jobs:
  checks:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Bootstrap (Node 24 for actions and the checks in tools/ci)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            nodejs24 nodejs24-bin nodejs24-npm-bin git curl gcc gcc-c++ make pkgconf-pkg-config perl tar xz ca-certificates
          node --version
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Self-tests of the CI checks
        run: node --test tools/ci/test/*.test.mjs
      - name: HTTP route inventory
        run: node tools/ci/check-api-routes.mjs
      - name: Server crate boundaries and package selections
        run: node tools/ci/check-server-boundaries.mjs --root .
      - name: Pins (images, actions, tools, locked Cargo commands, frozen installs, Node major, required jobs)
        run: |
          node tools/ci/check-pins.mjs --root .
          node tools/ci/reference-products.mjs --root .
      - name: Baseline of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Feature gates and Nitro comparison exclusions may only shrink compared with the base revision.
          # A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current allow-list is checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current allow-list is checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          if git cat-file -e "$base:tools/ci/protocol-tests-xtask-codegen.json" 2>/dev/null; then
            git show "$base:tools/ci/protocol-tests-xtask-codegen.json" > "$RUNNER_TEMP/base/protocol-tests-xtask-codegen.json"
          elif grep -q 'tools/ci/protocol-tests-xtask-codegen.json' "$RUNNER_TEMP/base/ci.yml"; then
            echo 'The base uses a missing protocol codegen baseline'
            exit 1
          fi
          if git cat-file -e "$base:tools/ci/feature-gates.json" 2>/dev/null; then
            git show "$base:tools/ci/feature-gates.json" > "$RUNNER_TEMP/base/feature-gates.json"
            echo "tools/ci/feature-gates.json: compared with $base"
          elif grep -q "tools/ci/feature-gates.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/ci/feature-gates.json is used by $base but missing there"
            exit 1
          else
            echo "tools/ci/feature-gates.json: new, $base does not use it yet"
          fi
          if git cat-file -e "$base:tools/ci/names-baseline.json" 2>/dev/null; then
            git show "$base:tools/ci/names-baseline.json" > "$RUNNER_TEMP/base/names-baseline.json"
            echo "tools/ci/names-baseline.json: compared with $base"
          elif grep -q "tools/ci/names-baseline.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/ci/names-baseline.json is used by $base but missing there"
            exit 1
          else
            echo "tools/ci/names-baseline.json: new, $base does not use it yet"
          fi
          if git cat-file -e "$base:tools/env-register.json" 2>/dev/null; then
            git show "$base:tools/env-register.json" > "$RUNNER_TEMP/base/env-register.json"
            echo "tools/env-register.json: compared with $base"
          elif grep -q "tools/env-register.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/env-register.json is used by $base but missing there"
            exit 1
          else
            echo "tools/env-register.json: new, $base does not use it yet"
          fi
          if git cat-file -e "$base:tools/web-api/non-comparable.json" 2>/dev/null; then
            git show "$base:tools/web-api/non-comparable.json" > "$RUNNER_TEMP/base/non-comparable.json"
            echo "tools/web-api/non-comparable.json: compared with $base"
          elif grep -q "tools/web-api/non-comparable" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/web-api/non-comparable.json is used by $base but missing there"
            exit 1
          else
            echo "tools/web-api/non-comparable.json: new, $base does not use it yet"
          fi
      - name: Feature gates (only the listed nightly features, only in the listed crates)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/feature-gates.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/feature-gates.json")
          fi
          node tools/ci/check-features.mjs --root . "${previous[@]}"
      - name: Names ratchet (names inherited from the upstream project may only shrink)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/names-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/names-baseline.json")
          fi
          node tools/ci/check-names.mjs --root . "${previous[@]}"
      - name: Environment register (every environment name is registered, nothing stale)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/env-register.json" ]; then
            previous=(--previous-register "$RUNNER_TEMP/base/env-register.json")
          fi
          node tools/ci/check-env.mjs --root . "${previous[@]}"
      - name: Nitro comparison exclusions (may only shrink)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/non-comparable.json" ]; then
            previous=(--previous "$RUNNER_TEMP/base/non-comparable.json")
          fi
          node tools/web-api/non-comparable.mjs "${previous[@]}"
      - name: Identity document (docs/dev/identity.md matches the identity table and the register)
        run: node tools/ci/identity-doc.mjs --root . --check
      - name: Identity bindings (every renamed place carries the value of the identity table)
        run: node tools/ci/check-identity.mjs --root .
      - name: Rust toolchain (rust-toolchain.toml) and cargo-deny
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
          # cargo-deny: the prebuilt release binary, checked against its pinned checksum.
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfLo "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$archive.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p /work/tools/bin
          install -m 0755 "$RUNNER_TEMP/$archive/cargo-deny" /work/tools/bin/cargo-deny
          echo /work/tools/bin >> "$GITHUB_PATH"
      - name: Protocol TypeScript dependencies (root lock and directory filter)
        run: |
          npm install -g "corepack@${COREPACK_VERSION}"
          corepack enable
          pnpm --version
          test -f engine/protocol/ts/package.json
          test -f engine/protocol/conformance/reference/package.json
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter "{./engine/protocol/ts}..." \
            --filter "{./engine/protocol/conformance/reference}..." --fail-if-no-match
      - name: Verified local protocol generators
        run: |
          node tools/ci/protocol-tools.mjs --root . --work /work --kind codegen
          echo "$GITHUB_WORKSPACE/engine/protocol/ts/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="/work/tools/bin:$GITHUB_WORKSPACE/engine/protocol/ts/node_modules/.bin:$PATH"
          for tool in buf protoc-gen-buffa protoc-gen-buffa-packaging protoc-gen-connect-rust protoc-gen-es cargo-deny; do
            command -v "$tool"
          done
          cargo fetch --locked
      - name: Protocol schema lint
        working-directory: engine/protocol
        run: buf lint
      - name: Protocol comparison base (actual event commit)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          node tools/ci/protocol-base.mjs --root . --event "$EVENT_NAME" --ref "$GITHUB_REF" \
            --current-sha "$GITHUB_SHA" --pr-base "$PR_BASE_SHA" --before "$PUSH_BEFORE" --out /work/comparison
      - name: Protocol breaking comparison (report before wire freeze)
        run: |
          node tools/ci/check-protocol-breaking.mjs --mode report --current "$GITHUB_WORKSPACE/engine/protocol" \
            --base /work/comparison/base/engine/protocol --source /work/comparison/source.json --out /work/results/breaking-base
      - name: Protocol breaking mechanism (field deletion must be detected)
        run: |
          node tools/ci/check-protocol-breaking.mjs --mode selftest --current "$GITHUB_WORKSPACE/engine/protocol" \
            --out /work/results/breaking-selftest
      - name: Protocol drift (compare unchanged checked-in outputs)
        run: |
          node tools/ci/export-protocol-source.mjs --repository . --commit "$GITHUB_SHA" --receipt "$RUNNER_TEMP/protocol-drift-source.json"
          cargo run --locked --offline -p impluvium-protocol-xtask -- check-drift
      - name: Protocol codegen counterexamples (scratch copies only)
        run: |
          cargo test --locked --offline -p impluvium-protocol-xtask --test codegen > /work/results/codegen-tests.txt 2>&1
          cargo metadata --locked --offline --format-version=1 > /work/results/codegen-metadata.json
          previous=()
          if [ -f "$RUNNER_TEMP/base/protocol-tests-xtask-codegen.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/protocol-tests-xtask-codegen.json")
          fi
          node tools/ci/count-tests.mjs --baseline tools/ci/protocol-tests-xtask-codegen.json "${previous[@]}" \
            --metadata /work/results/codegen-metadata.json --input /work/results/codegen-tests.txt
      - name: Protocol TypeScript package (strict types, build and exports)
        run: |
          pnpm -C engine/protocol/ts run typecheck
          pnpm -C engine/protocol/ts run build
          pnpm -C engine/protocol/ts run test
      - name: Reference types and imports
        run: |
          mkdir -p /work/results/reference /work/scratch/reference
          node tools/ci/export-protocol-source.mjs --repository . --commit "$GITHUB_SHA" --receipt /work/results/reference/source.json
          pnpm -C engine/protocol/conformance/reference run typecheck -- --source-sha "$GITHUB_SHA"
          pnpm -C engine/protocol/conformance/reference run imports -- --source-sha "$GITHUB_SHA" --out /work/results/reference/imports
      - name: Reference conformance
        run: |
          pnpm -C engine/protocol/conformance/reference run corpus -- --source-sha "$GITHUB_SHA" --out /work/results/reference/corpus
          pnpm -C engine/protocol/conformance/reference run coverage -- --source-sha "$GITHUB_SHA" --out /work/results/reference/coverage
          pnpm -C engine/protocol/conformance/reference run primitives -- --source-sha "$GITHUB_SHA" --out /work/results/reference/primitives
          node tools/ci/reference-run.mjs container --source-sha "$GITHUB_SHA" --out /work/results/reference/container
          pnpm -C engine/protocol/conformance/reference run vectors -- --source-sha "$GITHUB_SHA" --out /work/results/reference/vectors
          pnpm -C engine/protocol/conformance/reference run limits -- --source-sha "$GITHUB_SHA" --out /work/results/reference/limits
      - name: Reference counterexamples
        run: |
          pnpm -C engine/protocol/conformance/reference run counterexamples -- --source-sha "$GITHUB_SHA" --out /work/results/reference/counterexamples
      - name: Licence boundary (Rust and installed TypeScript graph)
        run: |
          cargo metadata --locked --all-features --format-version=1 > "$RUNNER_TEMP/metadata.json"
          test -f engine/protocol/ts/package.json
          test -f engine/protocol/conformance/reference/package.json
          pnpm --filter "{./engine/protocol/ts}..." \
            --filter "{./engine/protocol/conformance/reference}..." \
            list --depth Infinity --json --fail-if-no-match > /work/results/pnpm-graph.json
          node tools/ci/check-licence-boundary.mjs --root . --metadata "$RUNNER_TEMP/metadata.json" \
            --pnpm-graph /work/results/pnpm-graph.json --pnpm-lock pnpm-lock.yaml
      - name: Dependency licences, bans and sources (deny.toml)
        run: cargo deny --locked check licenses bans sources
      - name: Security advisories (report only)
        # Reported in every run, also for release tags; which advisories block is decided with the release checks.
        continue-on-error: true
        run: cargo deny --locked check advisories
      - name: Protocol schema and codegen evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-schema-evidence
          path: |
            /work/results/breaking-*/**
            /work/results/codegen-tests.txt
            /work/results/codegen-metadata.json
            /work/results/pnpm-graph.json
            /work/results/reference/**
            /work/comparison/source.json
            ${{ runner.temp }}/protocol-drift-source.json
          retention-days: 7

  server:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    env:
      # The checked queries of server-db are built from the metadata in the repository (.sqlx), never from a
      # database. This job has no database; with the variable set, a missing or stale file fails the build
      # instead of the build looking for a DATABASE_URL.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (stable, rust-toolchain.toml)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
      - name: Server Rust baselines of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *) echo "No base revision for this run ($EVENT_NAME $GITHUB_REF)"; exit 0 ;;
          esac
          test -n "$base"
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch: only the current baselines are checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          for name in clippy-baseline server-tests; do
            if git cat-file -e "$base:tools/ci/$name.json" 2>/dev/null; then
              git show "$base:tools/ci/$name.json" > "$RUNNER_TEMP/base/$name.json"
            elif grep -q "tools/ci/$name.json" "$RUNNER_TEMP/base/ci.yml"; then
              echo "tools/ci/$name.json is used by the base but missing there"
              exit 1
            else
              echo "tools/ci/$name.json: new baseline"
            fi
          done
      - name: Server Rust metadata and format
        run: |
          cargo fetch --locked
          cargo metadata --locked --offline --format-version=1 > "$RUNNER_TEMP/server-metadata.json"
          node tools/ci/check-server-boundaries.mjs --root . --metadata "$RUNNER_TEMP/server-metadata.json"
          cargo fmt --check -p server-api-types -p server-domain -p server-db -p server-http -p server-bin
      - name: Server Rust Clippy (zero warnings)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json")
          fi
          set +e
          cargo clippy --locked --all-targets --message-format=json \
            -p server-api-types -p server-domain -p server-db -p server-http -p server-bin \
            -- -D warnings > "$RUNNER_TEMP/server-clippy.jsonl"
          clippy_status=$?
          set -e
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/server-metadata.json" --input "$RUNNER_TEMP/server-clippy.jsonl" \
            --package server-api-types --package server-domain --package server-db --package server-http --package server-bin \
            --exclude impluvium-protocol
          test "$clippy_status" -eq 0
      - name: Server Rust tests (separate baseline)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/server-tests.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/server-tests.json")
          fi
          set +e
          cargo test --locked --no-fail-fast \
            -p server-api-types -p server-domain -p server-db -p server-http -p server-bin > "$RUNNER_TEMP/server-tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/server-tests.txt"
          node tools/ci/count-tests.mjs --baseline tools/ci/server-tests.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/server-metadata.json" --input "$RUNNER_TEMP/server-tests.txt" \
            --package server-api-types --package server-domain --package server-db --package server-http --package server-bin
          test "$test_status" -eq 0
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable && pnpm --version
      - name: Install dependencies (server and its Nuxt layer)
        run: pnpm install --frozen-lockfile --filter "{./server}..." --fail-if-no-match
      - name: HTTP contracts (generated files, independent client types and Nitro comparison)
        run: |
          node tools/web-api/check-consumers.mjs
          node tools/web-api/generate.mjs --check
          node tools/web-api/check-types.mjs
          node --test --test-concurrency=1 tools/web-api/test/*.test.mjs
      - name: Typecheck
        working-directory: server
        run: pnpm run typecheck
      - name: UI typecheck (empty server tree, no generated Nitro route types)
        working-directory: server
        run: pnpm run typecheck:ui
      - name: Lint
        working-directory: server
        run: pnpm run lint
      - name: Static transport, output and connection contracts
        run: node --test --test-concurrency=1 tools/web-spa/test/*.test.mjs
      - name: Separate server build and service-free static export
        env:
          IMPLUVIUM_GIT_REF: ${{ github.sha }}
          IMPLUVIUM_VERSION: 0.0.0-dev
        run: |
          pnpm -C server run build:server
          pnpm -C server run generate
          pnpm -C server run build:assemble
          test -f server/.output/server/server/index.mjs
          test -f server/.output/spa/public/index.html
          test -f server/.output/server/public/csp-hashes.json
          node server/.output/server/server/index.mjs --check-static-output
          node tools/web-spa/check-startup.mjs server/.output/server

  # Database tests of the server against real PostgreSQL servers. Only server-db is built here. The server job
  # stays free of services: it runs every other server test and leaves these ignored tests ignored.
  server-db:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - docker.io/library/postgres:16-trixie@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
          - docker.io/library/postgres:17-trixie@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
          - docker.io/library/postgres:18-trixie@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    services:
      postgres:
        image: ${{ matrix.postgres }}
        env:
          # A disposable value for a database that exists only for this job and is reachable only from it.
          # It is not a secret: this workflow has none. A service needs its password when it starts.
          POSTGRES_PASSWORD: disposable-ci-password
        options: "--health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12"
    env:
      IMPLUVIUM_TEST_DATABASE_URL: postgres://postgres:disposable-ci-password@postgres:5432/postgres
      # Checked queries use the metadata in the repository; only the steps that regenerate it use a database.
      SQLX_OFFLINE: "true"
      # The PostgreSQL client tools of the backup tests come from the PostgreSQL apt repository. Version 18
      # dumps servers 16, 17 and 18. The key file is pinned by checksum (key fingerprint
      # B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8), the package by its exact version.
      POSTGRESQL_APT_SIGNER_SHA256SUM: 0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76
      POSTGRESQL_CLIENT_PACKAGE: postgresql-client-18=18.7-1.pgdg24.04+2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (stable, rust-toolchain.toml)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 60); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/postgres/5432'; then
              echo "PostgreSQL accepts connections (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not accept connections in time"
          exit 1
      - name: PostgreSQL client tools (pg_dump and pg_restore 18 from the PostgreSQL apt repository)
        run: |
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
          export DEBIAN_FRONTEND=noninteractive
          curl -sSfo "$RUNNER_TEMP/postgresql-key.asc" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "${POSTGRESQL_APT_SIGNER_SHA256SUM}  $RUNNER_TEMP/postgresql-key.asc" | sha256sum -c -
          $SUDO install -d -m 0755 /usr/share/postgresql-common/pgdg
          $SUDO install -m 0644 "$RUNNER_TEMP/postgresql-key.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | $SUDO tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends "${POSTGRESQL_CLIENT_PACKAGE}"
          dpkg-query -W postgresql-client-18 libpq5
          pg_dump --version
          pg_restore --version
      # The metadata steps build against the database, not against .sqlx, so they run first: drift that breaks
      # the offline build below still gets its regenerated files printed.
      - name: Query metadata tool (version and lock file)
        if: contains(matrix.postgres, ':18-')
        run: |
          cargo xtask sqlx --version
          sha256sum Cargo.lock
      - name: Query metadata is up to date (checked queries against a migrated database)
        if: contains(matrix.postgres, ':18-')
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="${IMPLUVIUM_TEST_DATABASE_URL%/postgres}/impluvium_prepare"
          cargo xtask sqlx database create
          cargo xtask sqlx migrate run --source server/migrations
          set +e
          cargo xtask sqlx prepare --workspace --check -- --all-targets --locked -p server-db
          check_status=$?
          set -e
          if [ "$check_status" -ne 0 ]; then
            echo "The query metadata in .sqlx is out of date. Regenerated files follow; copy them into .sqlx."
            cargo xtask sqlx prepare --workspace -- --all-targets --locked -p server-db || true
            for file in .sqlx/query-*.json; do
              echo "=== $file"
              cat "$file"
            done
            exit 1
          fi
      - name: Query metadata check fails when a file is missing
        if: contains(matrix.postgres, ':18-')
        env:
          SQLX_OFFLINE: "false"
        run: |
          export DATABASE_URL="${IMPLUVIUM_TEST_DATABASE_URL%/postgres}/impluvium_prepare"
          file=$(ls .sqlx/query-*.json | head -n 1)
          cp "$file" "$RUNNER_TEMP/removed-query.json"
          rm "$file"
          set +e
          cargo xtask sqlx prepare --workspace --check -- --all-targets --locked -p server-db \
            > "$RUNNER_TEMP/negative-control.txt" 2>&1
          control_status=$?
          set -e
          cp "$RUNNER_TEMP/removed-query.json" "$file"
          cat "$RUNNER_TEMP/negative-control.txt"
          test "$control_status" -ne 0
          grep -q "missing one or more queries" "$RUNNER_TEMP/negative-control.txt"
      - name: Database tests (every test must run and pass)
        run: |
          set +e
          cargo test --locked -p server-db --test server_db_postgres -- --ignored --test-threads=1 \
            > "$RUNNER_TEMP/server-db-tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/server-db-tests.txt"
          test "$test_status" -eq 0
          # Exactly this many tests exist; a smaller number means tests were skipped or lost.
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed; 0 ignored;.*/\1/p' \
            "$RUNNER_TEMP/server-db-tests.txt")
          test "$passed" = "15"
      - name: Backup tests (real pg_dump and pg_restore against this server, every test must run and pass)
        run: |
          set +e
          cargo test --locked -p server-db --test server_db_backup -- --ignored --test-threads=1 \
            > "$RUNNER_TEMP/server-db-backup-tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/server-db-backup-tests.txt"
          test "$test_status" -eq 0
          # Exactly this many tests exist; a smaller number means tests were skipped or lost.
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed; 0 ignored;.*/\1/p' \
            "$RUNNER_TEMP/server-db-backup-tests.txt")
          test "$passed" = "3"
      - name: Start guard tests (lock, identity, initialisation, migration history, every test must run and pass)
        run: |
          set +e
          cargo test --locked -p server-db --test server_db_start_guard -- --ignored --test-threads=1 \
            > "$RUNNER_TEMP/server-db-guard-tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/server-db-guard-tests.txt"
          test "$test_status" -eq 0
          # Exactly this many tests exist; a smaller number means tests were skipped or lost.
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed; 0 ignored;.*/\1/p' \
            "$RUNNER_TEMP/server-db-guard-tests.txt")
          test "$passed" = "14"
      - name: Legacy schema parity (inherited chain and plain-SQL fixture, every test must run and pass)
        run: |
          set +e
          cargo test --locked -p server-db --test server_db_legacy_schema -- --ignored --test-threads=1 \
            > "$RUNNER_TEMP/server-db-legacy-tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/server-db-legacy-tests.txt"
          test "$test_status" -eq 0
          # Exactly this many tests exist; a smaller number means tests were skipped or lost.
          passed=$(sed -n 's/^test result: ok\. \([0-9][0-9]*\) passed; 0 failed; 0 ignored;.*/\1/p' \
            "$RUNNER_TEMP/server-db-legacy-tests.txt")
          test "$passed" = "3"

  desktop-ui:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable && pnpm --version
      - name: Install dependencies (desktop UI and its Nuxt layer)
        run: pnpm install --frozen-lockfile --filter "{./desktop/main}..." --fail-if-no-match
      - name: Baseline of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # As in the rust job: the TypeScript error count may only fall compared with the revision this run
          # builds on. A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current baseline is checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current baseline is checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          if git cat-file -e "$base:tools/ci/tsc-baseline.json" 2>/dev/null; then
            git show "$base:tools/ci/tsc-baseline.json" > "$RUNNER_TEMP/base/tsc-baseline.json"
            echo "tools/ci/tsc-baseline.json: compared with $base"
          elif grep -q "tools/ci/tsc-baseline.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/ci/tsc-baseline.json is used by $base but missing there"
            exit 1
          else
            echo "tools/ci/tsc-baseline.json: new, $base does not use it yet"
          fi
      - name: Typecheck (error count may only fall)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/tsc-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/tsc-baseline.json")
          fi
          set +e
          pnpm -C desktop/main run typecheck > "$RUNNER_TEMP/typecheck.txt" 2>&1
          typecheck_status=$?
          set -e
          cat "$RUNNER_TEMP/typecheck.txt"
          node tools/ci/tsc-ratchet.mjs --baseline tools/ci/tsc-baseline.json "${previous[@]}" \
            --package impluvium-desktop-ui --input "$RUNNER_TEMP/typecheck.txt" --status "$typecheck_status"

  rust:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Bootstrap (Node 24 for actions and the checks in tools/ci, build dependencies)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            nodejs24 nodejs24-bin git curl file gcc gcc-c++ make pkgconf-pkg-config perl \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel \
            libarchive-devel tar xz ca-certificates python3
          node --version
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchains (rust-toolchain.toml files)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
          cd desktop/src-tauri
          rustup toolchain install
          rustup show active-toolchain
      - name: Lock file (consistent with the manifests, Tauri crates at their locked versions)
        run: |
          cargo metadata --locked --all-features --format-version=1 > "$RUNNER_TEMP/metadata.json"
          node tools/ci/check-lock-versions.mjs --lock Cargo.lock --expect tools/ci/locked-versions.json
      - name: Baselines of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The ratchets compare the baselines with those of the revision this run builds on: the target
          # branch of a pull request, the previous head for a branch push. Counts may only fall, test counts
          # only rise. A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          node tools/ci/protocol-base.mjs --root . --event "$EVENT_NAME" --ref "$GITHUB_REF" --current-sha "$GITHUB_SHA" --pr-base "$PR_BASE_SHA" --before "$PUSH_BEFORE" --out "$RUNNER_TEMP/base/comparison"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current baselines are checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current baselines are checked."
            exit 0
          fi
          git cat-file commit "$base" > "$RUNNER_TEMP/base/commit.raw"
          node tools/ci/export-protocol-source.mjs --repository "$RUNNER_TEMP/base/comparison/base" --commit "$base" --commit-object "$RUNNER_TEMP/base/commit.raw" --receipt "$RUNNER_TEMP/base/source.json"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          for name in clippy-baseline test-baseline protocol-tests-core protocol-tests-server protocol-tests-client protocol-tests-combined protocol-tests-xtask-unit protocol-tests-hashchunk; do
            if git cat-file -e "$base:tools/ci/$name.json" 2>/dev/null; then
              git show "$base:tools/ci/$name.json" > "$RUNNER_TEMP/base/$name.json"
              echo "tools/ci/$name.json: compared with $base"
            elif grep -q "tools/ci/$name.json" "$RUNNER_TEMP/base/ci.yml" || { [[ "$name" == protocol-tests-core || "$name" == protocol-tests-server || "$name" == protocol-tests-client || "$name" == protocol-tests-combined ]] && grep -qF 'tools/ci/protocol-tests-$profile.json' "$RUNNER_TEMP/base/ci.yml"; }; then
              echo "tools/ci/$name.json is used by $base but missing there"
              exit 1
            else
              echo "tools/ci/$name.json: new, $base does not use it yet"
            fi
          done
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (stable, inherited packages)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json")
          fi
          set +e
          cargo clippy --locked --all-targets --message-format=json \
            -p torrential -p droplet-rs -p droplet_types -p libarchive-drop -- --cap-lints warn > "$RUNNER_TEMP/clippy-stable.jsonl"
          clippy_status=$?
          set -e
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/clippy-stable.jsonl" \
            --package torrential --package droplet-rs --package droplet_types --package libarchive-drop
          test "$clippy_status" -eq 0
      - name: Tests (stable, inherited packages)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/test-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/test-baseline.json")
          fi
          set +e
          cargo test --locked --no-fail-fast -p torrential -p droplet-rs -p droplet_types -p libarchive-drop > "$RUNNER_TEMP/tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/tests.txt"
          node tools/ci/count-tests.mjs --baseline tools/ci/test-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/tests.txt" \
            --package torrential --package droplet-rs --package droplet_types --package libarchive-drop
          test "$test_status" -eq 0
      - name: Protocol xtask (generator-free unit tests and Clippy)
        run: |
          mkdir -p /work/results
          cargo test --locked --offline -p impluvium-protocol-xtask --bin impluvium-protocol-xtask > /work/results/xtask-unit.txt 2>&1
          cargo clippy --locked --offline -p impluvium-protocol-xtask --all-targets --message-format=json \
            -- --cap-lints warn > /work/results/xtask-clippy.jsonl
          previous=()
          if [ -f "$RUNNER_TEMP/base/protocol-tests-xtask-unit.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/protocol-tests-xtask-unit.json")
          fi
          node tools/ci/count-tests.mjs --baseline tools/ci/protocol-tests-xtask-unit.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input /work/results/xtask-unit.txt
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json"); fi
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input /work/results/xtask-clippy.jsonl --package impluvium-protocol-xtask
      - name: Verified Windows cross tools and locked dependencies
        run: |
          node tools/ci/protocol-tools.mjs --root . --work /work --kind windows
          rustup target add x86_64-pc-windows-gnullvm
          cargo fetch --locked
      - name: Hash and chunk benchmark tool (tests and Clippy)
        run: |
          mkdir -p /work/results
          cargo test --locked --offline -p impluvium-hashchunk-bench --no-fail-fast > /work/results/hashchunk-tests.txt 2>&1
          cargo clippy --locked --offline -p impluvium-hashchunk-bench --all-targets --message-format=json \
            -- --cap-lints warn > /work/results/hashchunk-clippy.jsonl
          previous=()
          if [ -f "$RUNNER_TEMP/base/protocol-tests-hashchunk.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/protocol-tests-hashchunk.json")
          fi
          node tools/ci/count-tests.mjs --baseline tools/ci/protocol-tests-hashchunk.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input /work/results/hashchunk-tests.txt
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json"); fi
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input /work/results/hashchunk-clippy.jsonl \
            --package impluvium-hashchunk-bench --package impluvium-protocol
      - name: Corpus loader, result data and tree digest tests
        run: |
          mkdir -p /work/results
          python3 --version
          python3 -B -m unittest discover \
            -s engine/protocol/benchmarks/hashchunk/corpus \
            -p 'test_*.py' -v > /work/results/hashchunk-loader-tests.txt 2>&1
          cargo build --locked --offline -p impluvium-hashchunk-bench
          python3 -B engine/protocol/benchmarks/hashchunk/corpus/compare_tree_digest.py \
            --tool target/debug/chunkbench > /work/results/hashchunk-digest-comparison.txt 2>&1
      - name: Attest product source independently from Git objects
        run: node tools/ci/export-protocol-source.mjs --repository . --commit "$GITHUB_SHA" --receipt /work/results/source.json
      - name: Protocol package-feature evidence, contracts and separate ratchets
        run: node tools/ci/protocol-matrix.mjs --root . --contract tools/ci/protocol-graph.json --source-sha "$GITHUB_SHA" --source-receipt /work/results/source.json --windows-tools /work/llvm-mingw --out /work/results/profiles --previous-baselines "$RUNNER_TEMP/base" --previous-comparison "$RUNNER_TEMP/base/comparison/source.json" --previous-source-receipt "$RUNNER_TEMP/base/source.json"
      - name: Full protocol feature counterexamples (offline, package-preserving locks)
        run: node tools/ci/protocol-negative.mjs --mode check --repository . --commit "$GITHUB_SHA" --contract tools/ci/protocol-graph.json --out /work/results/negative
      - name: Complete workspace legacy-path report
        run: |
          base_sha="$(node -p 'JSON.parse(require("fs").readFileSync("tools/ci/protocol-graph.json", "utf8")).legacy.baseSha || "UNFILLED"')"
          node tools/ci/capture-protocol-workspace.mjs --root . --source-sha "$GITHUB_SHA" --base-sha "$base_sha" --contract tools/ci/protocol-graph.json --source-receipt /work/results/source.json --out /work/results/workspace
          node tools/ci/check-protocol-graph.mjs --root . --contract tools/ci/protocol-graph.json --source-sha "$GITHUB_SHA" --workspace /work/results/workspace/workspace.json
      - name: Clippy (nightly, desktop crates)
        # The desktop crates build only with the nightly toolchain of desktop/src-tauri/rust-toolchain.toml,
        # which applies in this directory. A separate target directory keeps the stable build intact.
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json")
          fi
          set +e
          cargo clippy --locked --all-targets --target-dir "$GITHUB_WORKSPACE/target/nightly" --message-format=json \
            -p impluvium -p client -p database -p download_manager -p games -p process -p remote -p utils \
            -- --cap-lints warn > "$RUNNER_TEMP/clippy-nightly.jsonl"
          clippy_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          # games depends on droplet_types, which the stable run already counts.
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/clippy-nightly.jsonl" \
            --package impluvium --package client --package database --package download_manager \
            --package games --package process --package remote --package utils --exclude droplet_types
          test "$clippy_status" -eq 0

      - name: Protocol product and workspace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-product-evidence
          path: |
            /work/results/**/invocation.json
            /work/results/**/capture-status.json
            /work/results/**/diagnostics.json
            /work/results/**/metadata.json
            /work/results/**/*.tree
            /work/results/**/*.stderr
            /work/results/**/graph.json
            /work/results/**/permission-candidate.json
            /work/results/**/cargo.stdout
            /work/results/**/cargo.jsonl
            /work/results/**/build.log
            /work/results/**/tools.json
            /work/results/**/compiler.jsonl
            /work/results/**/linker.jsonl
            /work/results/**/tests.txt
            /work/results/**/source.json
            /work/results/source.json
            /work/results/negative/results.json
            /work/results/profiles/matrix-results.json
            ${{ runner.temp }}/base/comparison/source.json
            ${{ runner.temp }}/base/source.json
            /work/results/**/rejection.json
            /work/results/**/*.mjs
            /work/results/**/*.mjs.json
            /work/results/workspace/*.json
            /work/results/xtask-*.txt
            /work/results/xtask-clippy.jsonl
            /work/results/hashchunk-tests.txt
            /work/results/hashchunk-clippy.jsonl
            /work/results/hashchunk-loader-tests.txt
            /work/results/hashchunk-digest-comparison.txt
            !/work/results/**/target/**
            !/work/results/negative/**/source/**
          retention-days: 7

  server-image:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release tag (pushed v* tag, or probe_tag of a manual run)
        env:
          PROBE_TAG: ${{ inputs.probe_tag }}
        run: |
          # A manual run with the input probe_tag takes the release-tag branch without a tag (nothing is published).
          tag=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch:*) tag="$PROBE_TAG" ;;
          esac
          if [ -n "$tag" ]; then
            # The whole value must be one SemVer tag. Anything else (a line break, a space) is rejected before
            # the grep, which would accept a value with one matching line, and before the GITHUB_ENV write.
            case "$tag" in
              *[!0-9A-Za-z.-]*) echo "Not a SemVer release tag (unexpected characters)"; exit 1 ;;
            esac
            if ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
              echo "Not a SemVer release tag: $tag"
              exit 1
            fi
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-none}"
      - name: Version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then version="${RELEASE_TAG#v}"; else version="0.0.0-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rootless BuildKit (unprivileged user, no Docker socket)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq uidmap rootlesskit libcap2-bin
          # newuidmap/newgidmap need file capabilities; the setuid variant fails in an unprivileged container.
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid+ep /usr/bin/newuidmap
          setcap cap_setgid+ep /usr/bin/newgidmap
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          install -m 0755 bin/* /usr/local/bin/
          useradd -m builder
          install -d -o builder "$RUNNER_TEMP/out"
      - name: Plant .env canaries (must stay out of the build context and the image)
        run: |
          # A random value, written to .env files that the .dockerignore must keep out of the build context.
          canary="impluvium-canary-$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          printf '%s\n' "$canary" > "$RUNNER_TEMP/canary"
          printf 'DATABASE_URL=postgres://canary:%s@localhost/canary\n' "$canary" > server/.env
          printf 'CANARY=%s\n' "$canary" > .env.local
          mkdir -p "$RUNNER_TEMP/control"
          cp Dockerfile "$RUNNER_TEMP/control/Dockerfile"
          # Positive control: the same ignore file without the .env exclusion. The frontend prefers
          # <Dockerfile>.dockerignore next to the Dockerfile over the context's .dockerignore.
          grep -vxF '**/.env*' .dockerignore > "$RUNNER_TEMP/control/Dockerfile.dockerignore"
          if cmp -s .dockerignore "$RUNNER_TEMP/control/Dockerfile.dockerignore"; then
            echo "positive control: the .env exclusion line was not found in .dockerignore"
            exit 1
          fi
          chmod -R a+rX "$RUNNER_TEMP/control"
      - name: Build server image (OCI archive)
        env:
          IMPLUVIUM_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/build.sh" <<'EOS'
          set -eu
          export XDG_RUNTIME_DIR=/tmp/run-builder
          mkdir -p "$XDG_RUNTIME_DIR"
          rootlesskit --net=host --disable-host-loopback --copy-up=/etc --copy-up=/run \
            buildkitd --oci-worker-no-process-sandbox --addr "unix://$XDG_RUNTIME_DIR/bk.sock" > /tmp/buildkitd.log 2>&1 &
          for i in $(seq 1 60); do buildctl --addr "unix://$XDG_RUNTIME_DIR/bk.sock" debug workers >/dev/null 2>&1 && break; sleep 1; done
          bk() { buildctl --addr "unix://$XDG_RUNTIME_DIR/bk.sock" build --frontend dockerfile.v0 --progress plain "$@"; }

          echo "== Leak test part 1: the build context contains no .env file"
          bk --local context=. --local dockerfile=. --opt target=context-audit

          echo "== Positive control: without the .env exclusion, context-audit must fail"
          if bk --local context=. --local dockerfile="$CONTROL" --opt target=context-audit > "$OUT/control.log" 2>&1; then
            cat "$OUT/control.log"
            echo "positive control: context-audit passed without the exclusion"
            exit 1
          fi
          # Match the step's output lines ("#<step> <seconds> ..."), not the echoed RUN command.
          grep -E '^#[0-9]+ [0-9.]+ context-audit: FAIL' "$OUT/control.log" \
            && grep -E '^#[0-9]+ [0-9.]+ /ctx/server/\.env$' "$OUT/control.log" \
            || { cat "$OUT/control.log"; echo "positive control: failed for another reason"; exit 1; }

          echo "== Server image"
          bk --local context=. --local dockerfile=. \
            --opt build-arg:IMPLUVIUM_VERSION="$IMPLUVIUM_VERSION" \
            --opt build-arg:IMPLUVIUM_GIT_REF="$GITHUB_SHA" \
            --output type=oci,dest="$OUT/server-image.tar"
          EOS
          chmod 0755 "$RUNNER_TEMP/build.sh"
          runuser -u builder -- env OUT="$RUNNER_TEMP/out" CONTROL="$RUNNER_TEMP/control" \
            IMPLUVIUM_VERSION="$IMPLUVIUM_VERSION" GITHUB_SHA="$GITHUB_SHA" bash "$RUNNER_TEMP/build.sh"
          mv "$RUNNER_TEMP/out/server-image.tar" server-image.tar
          sha256sum server-image.tar
      - name: Leak test part 2 (the canary is in no image blob)
        run: |
          canary="$(cat "$RUNNER_TEMP/canary")"
          # A string the image must contain (from launch.sh) proves that the scan reads the layers.
          marker='[impluvium] performing migrations'
          dir="$(mktemp -d)"
          tar -xf server-image.tar -C "$dir"
          for f in "$dir"/blobs/sha256/*; do
            if gzip -t "$f" 2>/dev/null; then gzip -dc "$f"; else cat "$f"; fi
          done | { grep -aoF -e "$marker" -e "$canary" || true; } | sort | uniq -c | sed "s|$canary|<canary>|" > "$dir/counts"
          cat "$dir/counts"
          grep -qF "$marker" "$dir/counts" || { echo "scan control: marker not found, the scan read nothing"; exit 1; }
          if grep -qF '<canary>' "$dir/counts"; then
            echo "LEAK: the canary from the planted .env files is in the image"
            exit 1
          fi
          echo "no canary in $(ls "$dir"/blobs/sha256 | wc -l) blobs"
          rm -rf "$dir"
      - name: Server image contents (runtime file list and invariants)
        run: |
          command -v python3 >/dev/null || apt-get install -y -qq python3
          dir="$(mktemp -d)"
          tar -xf server-image.tar -C "$dir"
          python3 -I - "$dir" <<'EOPY'
          import json, os, sys, tarfile
          d = sys.argv[1]
          blob = lambda digest: os.path.join(d, "blobs", *digest.split(":"))
          index = json.load(open(os.path.join(d, "index.json")))
          manifest = json.load(open(blob(index["manifests"][0]["digest"])))
          if "manifests" in manifest:
              manifest = json.load(open(blob(manifest["manifests"][0]["digest"])))
          config = json.load(open(blob(manifest["config"]["digest"])))
          print("Env:", config["config"].get("Env"))
          print("Cmd:", config["config"].get("Cmd"), "WorkingDir:", config["config"].get("WorkingDir"))
          files, elf = {}, b""
          for layer in manifest["layers"]:
              with tarfile.open(blob(layer["digest"])) as t:
                  for m in t:
                      name = "/" + (m.name[2:] if m.name.startswith("./") else m.name).lstrip("/")
                      base = os.path.basename(name)
                      if base == ".wh..wh..opq":
                          prefix = os.path.dirname(name) + "/"
                          files = {p: v for p, v in files.items() if not p.startswith(prefix)}
                      elif base.startswith(".wh."):
                          files.pop(os.path.join(os.path.dirname(name), base[4:]), None)
                      else:
                          files[name] = m
                          if name == "/usr/bin/torrential" and m.isfile():
                              elf = t.extractfile(m).read()
          problems = []
          want = ["/usr/bin/torrential", "/app/node_modules/.bin/prisma", "/app/startup/launch.sh",
                  "/app/prisma.config.ts", "/app/prisma/schema.prisma", "/app/app/server/index.mjs", "/nginx.conf",
                  "/app/app/server/nitro-entry.mjs", "/app/app/public/index.html",
                  "/app/app/public/loading.css", "/app/app/public/csp-hashes.json"]
          for w in want:
              print("present" if w in files else "MISSING", w)
              if w not in files:
                  problems.append(f"missing {w}")
          top = sorted({p.split("/")[2] for p in files if p.startswith("/app/") and len(p.split("/")) > 2})
          print("/app top level:", top)
          if top != ["app", "node_modules", "prisma", "prisma.config.ts", "startup"]:
              problems.append("unexpected /app top level (the runtime must not contain the build context)")
          env_files = sorted(p for p in files if os.path.basename(p).startswith(".env"))
          print(".env files in the image:", env_files)
          if env_files:
              problems.append(".env files in the image")
          git = sorted(p for p in files if "/.git/" in p + "/")
          print(".git in the image:", git[:5])
          if git:
              problems.append(".git in the image")
          print("7z programs:", sorted(p for p in files if p.startswith("/usr/bin/7z")))
          linked = b"libarchive.so.13\0" in elf
          print("torrential links libarchive.so.13:", linked)
          if not linked:
              problems.append("torrential does not link libarchive.so.13")
          for p in problems:
              print("FAIL:", p)
          sys.exit(1 if problems else 0)
          EOPY
          rm -rf "$dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-image
          path: server-image.tar
          # Each image is about 180 MB; keep only what smoke tests and publication need.
          retention-days: 7

  client-linux:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      NO_STRIP: "true"
    steps:
      - name: Bootstrap (Node 24 for actions and the UI build, build dependencies)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            nodejs24 nodejs24-bin nodejs24-npm-bin git curl file gcc gcc-c++ make pkgconf-pkg-config perl \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          node --version
          # The Node major is pinned in .node-version; the versioned packages provide the plain node and npm.
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release tag (pushed v* tag, or probe_tag of a manual run)
        env:
          PROBE_TAG: ${{ inputs.probe_tag }}
        run: |
          # A manual run with the input probe_tag takes the release-tag branch without a tag (nothing is published).
          tag=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch:*) tag="$PROBE_TAG" ;;
          esac
          if [ -n "$tag" ]; then
            # The whole value must be one SemVer tag. Anything else (a line break, a space) is rejected before
            # the grep, which would accept a value with one matching line, and before the GITHUB_ENV write.
            case "$tag" in
              *[!0-9A-Za-z.-]*) echo "Not a SemVer release tag (unexpected characters)"; exit 1 ;;
            esac
            if ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
              echo "Not a SemVer release tag: $tag"
              exit 1
            fi
          fi
          printf 'RELEASE_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-none}"
      - name: Rust toolchain (desktop/src-tauri/rust-toolchain.toml)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # tauri runs cargo in desktop/src-tauri, where the nightly toolchain file applies.
          cd desktop/src-tauri && rustup toolchain install && rustup show active-toolchain
      - name: Install dependencies
        run: |
          npm install -g "corepack@${COREPACK_VERSION}" && corepack enable && pnpm --version
          # Only the desktop client (Tauri CLI) and its UI with the UI's Nuxt layer; the server is not needed here.
          pnpm install --frozen-lockfile --filter "{./desktop}" --filter "{./desktop/main}..." --fail-if-no-match
      - name: Build RPM
        working-directory: desktop
        run: |
          # Release tags: RPM Release "1" (the warden policy's release_build.rpm_release); other builds "0.dev".
          if [ -n "$RELEASE_TAG" ]; then release="1"; else release="0.dev"; fi
          printf '{"bundle":{"linux":{"rpm":{"epoch":1,"release":"%s"}}}}' "$release" > "$RUNNER_TEMP/rpm.json"
          # The workspace profile release-desktop (LTO, panic = abort) builds the client; output under target/release-desktop.
          # Tauri builds the UI first (beforeBuildCommand: nuxt generate into desktop/.output/main).
          pnpm exec tauri build --bundles rpm --config "$RUNNER_TEMP/rpm.json" -- --locked --profile release-desktop
      - name: Check desktop UI output
        run: |
          # The client loads main/index.html from desktop/.output, with its assets under /main/_nuxt/.
          test -f desktop/.output/main/index.html
          grep -q '"/main/_nuxt/' desktop/.output/main/index.html
          echo "$(find desktop/.output/main -type f | wc -l) files, $(find desktop/.output/main/_nuxt -type f | wc -l) under _nuxt"
      - name: Check RPM
        run: |
          rpm=$(ls target/release-desktop/bundle/rpm/*.rpm)
          rpm -qp --qf '%{NAME} %{EPOCH}:%{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm"
          rpm -qpR "$rpm"
          # A release tag must build exactly its own version: RPM Version = tag without "v", "-" -> "~".
          if [ -n "$RELEASE_TAG" ]; then
            want=$(printf '%s' "${RELEASE_TAG#v}" | tr '-' '~')
            have=$(rpm -qp --qf '%{VERSION}' "$rpm")
            [ "$have" = "$want" ] || { echo "RPM version $have does not match tag ${RELEASE_TAG} ($want)"; exit 1; }
          fi
          sha256sum "$rpm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-rpm
          path: target/release-desktop/bundle/rpm/*.rpm
          retention-days: 30
