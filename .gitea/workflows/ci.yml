# impluvium CI – builds and checks only. This workflow gets no secrets: publication, privacy checks and releases
# happen outside of CI. Runs only on the dedicated runner (label impluvium-linux, no Docker socket in jobs).
# Pull requests against impluvium/main run the same jobs; the publication check uses the push run on impluvium/main.
name: impluvium-ci

on:
  push:
    branches: ["impluvium/main"]
    # Release tags are plain SemVer: v0.1.0, v0.1.0-rc.1.
    tags: ["v*"]
  pull_request:
    branches: ["impluvium/main"]
  workflow_dispatch:
    inputs:
      probe_tag:
        description: "Run the release-tag branch as if this tag (for example v0.4.0) had been pushed; builds only"
        required: false
        default: ""

# Cancel superseded runs of the same pull request. Every push run gets its own group (keyed by the commit), so a
# run on the main branch is never cancelled or replaced; publication needs each of them to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned build inputs: actions by commit SHA, job images by digest, tools by version and checksum.
  # Every pin has exactly one place (tools/ci/check-pins.mjs checks this). The server image's base images are
  # pinned in the Dockerfile; Rust toolchains come from the rust-toolchain.toml files (root: stable,
  # desktop/src-tauri: nightly).
  RUSTUP_VERSION: 1.29.2
  RUSTUP_SHA256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
  COREPACK_VERSION: 0.36.0
  BUILDKIT_VERSION: v0.34.1
  BUILDKIT_SHA256: a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  checks:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Bootstrap (Node 24 for actions and the checks in tools/ci)
        run: |
          dnf -y install --setopt=install_weak_deps=False nodejs24 nodejs24-bin git curl
          node --version
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Self-tests of the CI checks
        run: node --test tools/ci/test/*.test.mjs
      - name: Pins (images, actions, tools, locked Cargo commands, frozen installs, Node major, required jobs)
        run: node tools/ci/check-pins.mjs --root .
      - name: Baseline of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # As in the rust job: the allow-list of feature gates may only shrink compared with the revision this
          # run builds on. A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current allow-list is checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current allow-list is checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          if git cat-file -e "$base:tools/ci/feature-gates.json" 2>/dev/null; then
            git show "$base:tools/ci/feature-gates.json" > "$RUNNER_TEMP/base/feature-gates.json"
            echo "tools/ci/feature-gates.json: compared with $base"
          elif grep -q "tools/ci/feature-gates.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/ci/feature-gates.json is used by $base but missing there"
            exit 1
          else
            echo "tools/ci/feature-gates.json: new, $base does not use it yet"
          fi
      - name: Feature gates (only the listed nightly features, only in the listed crates)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/feature-gates.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/feature-gates.json")
          fi
          node tools/ci/check-features.mjs --root . "${previous[@]}"
      - name: Rust toolchain (rust-toolchain.toml) and cargo-deny
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
          # cargo-deny: the prebuilt release binary, checked against its pinned checksum.
          archive="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfLo "$RUNNER_TEMP/$archive.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$archive.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$archive/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Licence boundary (engine/ stays permissive; there is no engine/ yet)
        run: |
          cargo metadata --locked --all-features --format-version=1 > "$RUNNER_TEMP/metadata.json"
          node tools/ci/check-licence-boundary.mjs --root . --metadata "$RUNNER_TEMP/metadata.json" --allow-no-engine
      - name: Dependency licences, bans and sources (deny.toml)
        run: cargo deny --locked check licenses bans sources
      - name: Security advisories (report only)
        # Reported in every run, also for release tags; which advisories block is decided with the release checks.
        continue-on-error: true
        run: cargo deny --locked check advisories

  server:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable && pnpm --version
      - name: Install dependencies (server and its Nuxt layer)
        run: pnpm install --frozen-lockfile --filter "{./server}..." --fail-if-no-match
      - name: Typecheck
        working-directory: server
        run: pnpm run typecheck
      - name: Lint
        working-directory: server
        run: pnpm run lint

  desktop-ui:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable pnpm (corepack, version from package.json)
        run: corepack enable && pnpm --version
      - name: Install dependencies (desktop UI and its Nuxt layer)
        run: pnpm install --frozen-lockfile --filter "{./desktop/main}..." --fail-if-no-match
      - name: Baseline of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # As in the rust job: the TypeScript error count may only fall compared with the revision this run
          # builds on. A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current baseline is checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current baseline is checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          if git cat-file -e "$base:tools/ci/tsc-baseline.json" 2>/dev/null; then
            git show "$base:tools/ci/tsc-baseline.json" > "$RUNNER_TEMP/base/tsc-baseline.json"
            echo "tools/ci/tsc-baseline.json: compared with $base"
          elif grep -q "tools/ci/tsc-baseline.json" "$RUNNER_TEMP/base/ci.yml"; then
            echo "tools/ci/tsc-baseline.json is used by $base but missing there"
            exit 1
          else
            echo "tools/ci/tsc-baseline.json: new, $base does not use it yet"
          fi
      - name: Typecheck (error count may only fall)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/tsc-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/tsc-baseline.json")
          fi
          set +e
          pnpm -C desktop/main run typecheck > "$RUNNER_TEMP/typecheck.txt" 2>&1
          typecheck_status=$?
          set -e
          cat "$RUNNER_TEMP/typecheck.txt"
          node tools/ci/tsc-ratchet.mjs --baseline tools/ci/tsc-baseline.json "${previous[@]}" \
            --package view --input "$RUNNER_TEMP/typecheck.txt" --status "$typecheck_status"

  rust:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Bootstrap (Node 24 for actions and the checks in tools/ci, build dependencies)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            nodejs24 nodejs24-bin git curl file gcc gcc-c++ make pkgconf-pkg-config perl \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel \
            libarchive-devel
          node --version
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchains (rust-toolchain.toml files)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup show active-toolchain
          cd desktop/src-tauri
          rustup toolchain install
          rustup show active-toolchain
      - name: Lock file (consistent with the manifests, Tauri crates at their locked versions)
        run: |
          cargo metadata --locked --all-features --format-version=1 > "$RUNNER_TEMP/metadata.json"
          node tools/ci/check-lock-versions.mjs --lock Cargo.lock --expect tools/ci/locked-versions.json
      - name: Baselines of the base revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The ratchets compare the baselines with those of the revision this run builds on: the target
          # branch of a pull request, the previous head for a branch push. Counts may only fall, test counts
          # only rise. A missing base fails the run; only a new branch, a tag push and a manual run have none.
          mkdir -p "$RUNNER_TEMP/base"
          case "$EVENT_NAME:$GITHUB_REF" in
            pull_request:*) base="$PR_BASE_SHA" ;;
            push:refs/heads/*) base="$PUSH_BEFORE" ;;
            *)
              echo "No base revision for this run ($EVENT_NAME $GITHUB_REF): only the current baselines are checked."
              exit 0
              ;;
          esac
          if [ -z "$base" ]; then
            echo "The $EVENT_NAME event for $GITHUB_REF names no base revision"
            exit 1
          fi
          if [ "$EVENT_NAME" = push ] && [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch $GITHUB_REF: no base revision, only the current baselines are checked."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          git show "$base:.gitea/workflows/ci.yml" > "$RUNNER_TEMP/base/ci.yml"
          for name in clippy-baseline test-baseline; do
            if git cat-file -e "$base:tools/ci/$name.json" 2>/dev/null; then
              git show "$base:tools/ci/$name.json" > "$RUNNER_TEMP/base/$name.json"
              echo "tools/ci/$name.json: compared with $base"
            elif grep -q "tools/ci/$name.json" "$RUNNER_TEMP/base/ci.yml"; then
              echo "tools/ci/$name.json is used by $base but missing there"
              exit 1
            else
              echo "tools/ci/$name.json: new, $base does not use it yet"
            fi
          done
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (stable, default members)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json")
          fi
          set +e
          cargo clippy --locked --all-targets --message-format=json -- --cap-lints warn > "$RUNNER_TEMP/clippy-stable.jsonl"
          clippy_status=$?
          set -e
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/clippy-stable.jsonl" \
            --package torrential --package droplet-rs --package droplet_types --package libarchive-drop
          test "$clippy_status" -eq 0
      - name: Tests (stable, default members)
        run: |
          previous=()
          if [ -f "$RUNNER_TEMP/base/test-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/test-baseline.json")
          fi
          set +e
          cargo test --locked --no-fail-fast > "$RUNNER_TEMP/tests.txt" 2>&1
          test_status=$?
          set -e
          cat "$RUNNER_TEMP/tests.txt"
          node tools/ci/count-tests.mjs --baseline tools/ci/test-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/tests.txt"
          test "$test_status" -eq 0
      - name: Clippy (nightly, desktop crates)
        # The desktop crates build only with the nightly toolchain of desktop/src-tauri/rust-toolchain.toml,
        # which applies in this directory. A separate target directory keeps the stable build intact.
        working-directory: desktop/src-tauri
        run: |
          rustup show active-toolchain
          previous=()
          if [ -f "$RUNNER_TEMP/base/clippy-baseline.json" ]; then
            previous=(--previous-baseline "$RUNNER_TEMP/base/clippy-baseline.json")
          fi
          set +e
          cargo clippy --locked --all-targets --target-dir "$GITHUB_WORKSPACE/target/nightly" --message-format=json \
            -p drop-app -p client -p database -p download_manager -p games -p process -p remote -p utils \
            -- --cap-lints warn > "$RUNNER_TEMP/clippy-nightly.jsonl"
          clippy_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          # games depends on droplet_types, which the stable run already counts.
          node tools/ci/clippy-ratchet.mjs --baseline tools/ci/clippy-baseline.json "${previous[@]}" \
            --metadata "$RUNNER_TEMP/metadata.json" --input "$RUNNER_TEMP/clippy-nightly.jsonl" \
            --package drop-app --package client --package database --package download_manager \
            --package games --package process --package remote --package utils --exclude droplet_types
          test "$clippy_status" -eq 0

  server-image:
    runs-on: impluvium-linux
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04@sha256:2992a8a0448aba1c093255787390b2a090fefbfd76cc25db107f527e9bd65d3a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release tag (pushed v* tag, or probe_tag of a manual run)
        env:
          PROBE_TAG: ${{ inputs.probe_tag }}
        run: |
          # A manual run with the input probe_tag takes the release-tag branch without a tag (nothing is published).
          tag=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch:*) tag="$PROBE_TAG" ;;
          esac
          if [ -n "$tag" ] && ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "Not a SemVer release tag: $tag"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-none}"
      - name: Version
        id: version
        run: |
          if [ -n "$RELEASE_TAG" ]; then version="${RELEASE_TAG#v}"; else version="0.0.0-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Rootless BuildKit (unprivileged user, no Docker socket)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq uidmap rootlesskit libcap2-bin
          # newuidmap/newgidmap need file capabilities; the setuid variant fails in an unprivileged container.
          chmod u-s /usr/bin/newuidmap /usr/bin/newgidmap
          setcap cap_setuid+ep /usr/bin/newuidmap
          setcap cap_setgid+ep /usr/bin/newgidmap
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          install -m 0755 bin/* /usr/local/bin/
          useradd -m builder
          install -d -o builder "$RUNNER_TEMP/out"
      - name: Plant .env canaries (must stay out of the build context and the image)
        run: |
          # A random value, written to .env files that the .dockerignore must keep out of the build context.
          canary="impluvium-canary-$(od -An -N24 -tx1 /dev/urandom | tr -d ' \n')"
          printf '%s\n' "$canary" > "$RUNNER_TEMP/canary"
          printf 'DATABASE_URL=postgres://canary:%s@localhost/canary\n' "$canary" > server/.env
          printf 'CANARY=%s\n' "$canary" > .env.local
          mkdir -p "$RUNNER_TEMP/control"
          cp Dockerfile "$RUNNER_TEMP/control/Dockerfile"
          # Positive control: the same ignore file without the .env exclusion. The frontend prefers
          # <Dockerfile>.dockerignore next to the Dockerfile over the context's .dockerignore.
          grep -vxF '**/.env*' .dockerignore > "$RUNNER_TEMP/control/Dockerfile.dockerignore"
          if cmp -s .dockerignore "$RUNNER_TEMP/control/Dockerfile.dockerignore"; then
            echo "positive control: the .env exclusion line was not found in .dockerignore"
            exit 1
          fi
          chmod -R a+rX "$RUNNER_TEMP/control"
      - name: Build server image (OCI archive)
        env:
          DROP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/build.sh" <<'EOS'
          set -eu
          export XDG_RUNTIME_DIR=/tmp/run-builder
          mkdir -p "$XDG_RUNTIME_DIR"
          rootlesskit --net=host --disable-host-loopback --copy-up=/etc --copy-up=/run \
            buildkitd --oci-worker-no-process-sandbox --addr "unix://$XDG_RUNTIME_DIR/bk.sock" > /tmp/buildkitd.log 2>&1 &
          for i in $(seq 1 60); do buildctl --addr "unix://$XDG_RUNTIME_DIR/bk.sock" debug workers >/dev/null 2>&1 && break; sleep 1; done
          bk() { buildctl --addr "unix://$XDG_RUNTIME_DIR/bk.sock" build --frontend dockerfile.v0 --progress plain "$@"; }

          echo "== Leak test part 1: the build context contains no .env file"
          bk --local context=. --local dockerfile=. --opt target=context-audit

          echo "== Positive control: without the .env exclusion, context-audit must fail"
          if bk --local context=. --local dockerfile="$CONTROL" --opt target=context-audit > "$OUT/control.log" 2>&1; then
            cat "$OUT/control.log"
            echo "positive control: context-audit passed without the exclusion"
            exit 1
          fi
          # Match the step's output lines ("#<step> <seconds> ..."), not the echoed RUN command.
          grep -E '^#[0-9]+ [0-9.]+ context-audit: FAIL' "$OUT/control.log" \
            && grep -E '^#[0-9]+ [0-9.]+ /ctx/server/\.env$' "$OUT/control.log" \
            || { cat "$OUT/control.log"; echo "positive control: failed for another reason"; exit 1; }

          echo "== Server image"
          bk --local context=. --local dockerfile=. \
            --opt build-arg:BUILD_DROP_VERSION="$DROP_VERSION" \
            --opt build-arg:BUILD_GIT_REF="$GITHUB_SHA" \
            --output type=oci,dest="$OUT/server-image.tar"
          EOS
          chmod 0755 "$RUNNER_TEMP/build.sh"
          runuser -u builder -- env OUT="$RUNNER_TEMP/out" CONTROL="$RUNNER_TEMP/control" \
            DROP_VERSION="$DROP_VERSION" GITHUB_SHA="$GITHUB_SHA" bash "$RUNNER_TEMP/build.sh"
          mv "$RUNNER_TEMP/out/server-image.tar" server-image.tar
          sha256sum server-image.tar
      - name: Leak test part 2 (the canary is in no image blob)
        run: |
          canary="$(cat "$RUNNER_TEMP/canary")"
          # A string the image must contain (from launch.sh) proves that the scan reads the layers.
          marker='[Drop] performing migrations'
          dir="$(mktemp -d)"
          tar -xf server-image.tar -C "$dir"
          for f in "$dir"/blobs/sha256/*; do
            if gzip -t "$f" 2>/dev/null; then gzip -dc "$f"; else cat "$f"; fi
          done | { grep -aoF -e "$marker" -e "$canary" || true; } | sort | uniq -c | sed "s|$canary|<canary>|" > "$dir/counts"
          cat "$dir/counts"
          grep -qF "$marker" "$dir/counts" || { echo "scan control: marker not found, the scan read nothing"; exit 1; }
          if grep -qF '<canary>' "$dir/counts"; then
            echo "LEAK: the canary from the planted .env files is in the image"
            exit 1
          fi
          echo "no canary in $(ls "$dir"/blobs/sha256 | wc -l) blobs"
          rm -rf "$dir"
      - name: Server image contents (runtime file list and invariants)
        run: |
          command -v python3 >/dev/null || apt-get install -y -qq python3
          dir="$(mktemp -d)"
          tar -xf server-image.tar -C "$dir"
          python3 -I - "$dir" <<'EOPY'
          import json, os, sys, tarfile
          d = sys.argv[1]
          blob = lambda digest: os.path.join(d, "blobs", *digest.split(":"))
          index = json.load(open(os.path.join(d, "index.json")))
          manifest = json.load(open(blob(index["manifests"][0]["digest"])))
          if "manifests" in manifest:
              manifest = json.load(open(blob(manifest["manifests"][0]["digest"])))
          config = json.load(open(blob(manifest["config"]["digest"])))
          print("Env:", config["config"].get("Env"))
          print("Cmd:", config["config"].get("Cmd"), "WorkingDir:", config["config"].get("WorkingDir"))
          files, elf = {}, b""
          for layer in manifest["layers"]:
              with tarfile.open(blob(layer["digest"])) as t:
                  for m in t:
                      name = "/" + (m.name[2:] if m.name.startswith("./") else m.name).lstrip("/")
                      base = os.path.basename(name)
                      if base == ".wh..wh..opq":
                          prefix = os.path.dirname(name) + "/"
                          files = {p: v for p, v in files.items() if not p.startswith(prefix)}
                      elif base.startswith(".wh."):
                          files.pop(os.path.join(os.path.dirname(name), base[4:]), None)
                      else:
                          files[name] = m
                          if name == "/usr/bin/torrential" and m.isfile():
                              elf = t.extractfile(m).read()
          problems = []
          want = ["/usr/bin/torrential", "/app/node_modules/.bin/prisma", "/app/startup/launch.sh",
                  "/app/prisma.config.ts", "/app/prisma/schema.prisma", "/app/app/server/index.mjs", "/nginx.conf"]
          for w in want:
              print("present" if w in files else "MISSING", w)
              if w not in files:
                  problems.append(f"missing {w}")
          top = sorted({p.split("/")[2] for p in files if p.startswith("/app/") and len(p.split("/")) > 2})
          print("/app top level:", top)
          if top != ["app", "node_modules", "prisma", "prisma.config.ts", "startup"]:
              problems.append("unexpected /app top level (the runtime must not contain the build context)")
          env_files = sorted(p for p in files if os.path.basename(p).startswith(".env"))
          print(".env files in the image:", env_files)
          if env_files:
              problems.append(".env files in the image")
          git = sorted(p for p in files if "/.git/" in p + "/")
          print(".git in the image:", git[:5])
          if git:
              problems.append(".git in the image")
          print("7z programs:", sorted(p for p in files if p.startswith("/usr/bin/7z")))
          linked = b"libarchive.so.13\0" in elf
          print("torrential links libarchive.so.13:", linked)
          if not linked:
              problems.append("torrential does not link libarchive.so.13")
          for p in problems:
              print("FAIL:", p)
          sys.exit(1 if problems else 0)
          EOPY
          rm -rf "$dir"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-image
          path: server-image.tar
          retention-days: 30

  client-linux:
    runs-on: impluvium-linux
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    env:
      NO_STRIP: "true"
    steps:
      - name: Bootstrap (Node 24 for actions and the UI build, build dependencies)
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            nodejs24 nodejs24-bin nodejs24-npm-bin git curl file gcc gcc-c++ make pkgconf-pkg-config perl \
            webkit2gtk4.1-devel openssl-devel libappindicator-gtk3-devel librsvg2-devel libxdo-devel
          node --version
          # The Node major is pinned in .node-version; the versioned packages provide the plain node and npm.
          node --version | grep -q '^v24\.'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release tag (pushed v* tag, or probe_tag of a manual run)
        env:
          PROBE_TAG: ${{ inputs.probe_tag }}
        run: |
          # A manual run with the input probe_tag takes the release-tag branch without a tag (nothing is published).
          tag=""
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/tags/v*) tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch:*) tag="$PROBE_TAG" ;;
          esac
          if [ -n "$tag" ] && ! printf '%s\n' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "Not a SemVer release tag: $tag"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: ${tag:-none}"
      - name: Rust toolchain (desktop/src-tauri/rust-toolchain.toml)
        run: |
          curl -sSfo "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          echo "${RUSTUP_SHA256}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          # tauri runs cargo in desktop/src-tauri, where the nightly toolchain file applies.
          cd desktop/src-tauri && rustup toolchain install && rustup show active-toolchain
      - name: Install dependencies
        run: |
          npm install -g "corepack@${COREPACK_VERSION}" && corepack enable && pnpm --version
          # Only the desktop client (Tauri CLI) and its UI with the UI's Nuxt layer; the server is not needed here.
          pnpm install --frozen-lockfile --filter "{./desktop}" --filter "{./desktop/main}..." --fail-if-no-match
      - name: Build RPM
        working-directory: desktop
        run: |
          # Release tags: RPM Release "1" (the warden policy's release_build.rpm_release); other builds "0.dev".
          if [ -n "$RELEASE_TAG" ]; then release="1"; else release="0.dev"; fi
          printf '{"bundle":{"linux":{"rpm":{"epoch":1,"release":"%s"}}}}' "$release" > "$RUNNER_TEMP/rpm.json"
          # The workspace profile release-desktop (LTO, panic = abort) builds the client; output under target/release-desktop.
          # Tauri builds the UI first (beforeBuildCommand: nuxt generate into desktop/.output/main).
          pnpm exec tauri build --bundles rpm --config "$RUNNER_TEMP/rpm.json" -- --locked --profile release-desktop
      - name: Check desktop UI output
        run: |
          # The client loads main/index.html from desktop/.output, with its assets under /main/_nuxt/.
          test -f desktop/.output/main/index.html
          grep -q '"/main/_nuxt/' desktop/.output/main/index.html
          echo "$(find desktop/.output/main -type f | wc -l) files, $(find desktop/.output/main/_nuxt -type f | wc -l) under _nuxt"
      - name: Check RPM
        run: |
          rpm=$(ls target/release-desktop/bundle/rpm/*.rpm)
          rpm -qp --qf '%{NAME} %{EPOCH}:%{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm"
          rpm -qpR "$rpm"
          # A release tag must build exactly its own version: RPM Version = tag without "v", "-" -> "~".
          if [ -n "$RELEASE_TAG" ]; then
            want=$(printf '%s' "${RELEASE_TAG#v}" | tr '-' '~')
            have=$(rpm -qp --qf '%{VERSION}' "$rpm")
            [ "$have" = "$want" ] || { echo "RPM version $have does not match tag ${RELEASE_TAG} ($want)"; exit 1; }
          fi
          sha256sum "$rpm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-rpm
          path: target/release-desktop/bundle/rpm/*.rpm
          retention-days: 30
